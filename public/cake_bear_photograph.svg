<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background pattern of soft polka dots -->
    <pattern id="bg-dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="14" fill="#E8E2F2" opacity="0.65" />
      <circle cx="60" cy="60" r="14" fill="#E8E2F2" opacity="0.65" />
      <circle cx="20" cy="60" r="3" fill="#B9A8D6" opacity="0.6" />
      <circle cx="60" cy="20" r="3" fill="#B9A8D6" opacity="0.6" />
    </pattern>

    <!-- Plate checkered pattern -->
    <pattern id="plate-check" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 24 0 M 0 0 L 0 24" stroke="#BCD2EE" stroke-width="1.2" fill="none" opacity="0.45" />
    </pattern>

    <!-- Drop shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8C7D9B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="#FBF9FE" />
  <rect width="600" height="600" fill="url(#bg-dots)" />

  <!-- Background Sparkle Stars -->
  <g fill="#A894C2" opacity="0.6">
    <!-- Top right star -->
    <path d="M 420 50 Q 420 70 440 70 Q 420 70 420 90 Q 420 70 400 70 Q 420 70 420 50 Z" />
    <!-- Left star -->
    <path d="M 80 220 Q 80 238 98 238 Q 80 238 80 256 Q 80 238 62 238 Q 80 238 80 220 Z" fill="#6A5343" opacity="0.75" />
    <!-- Bottom star -->
    <path d="M 260 500 Q 260 520 280 520 Q 260 520 260 540 Q 260 520 240 520 Q 260 520 260 500 Z" />
    <!-- Right star -->
    <path d="M 510 330 Q 510 355 535 355 Q 510 355 510 380 Q 510 355 485 355 Q 510 355 510 330 Z" fill="#7F98C7" opacity="0.8" />
  </g>

  <!-- Scalloped Plate with Checkered Grid & Stars -->
  <g filter="url(#soft-shadow)">
    <!-- Scalloped rim shape -->
    <path d="M 120 320 
             Q 90 350 105 385 
             Q 120 420 160 435 
             Q 220 465 300 465 
             Q 380 465 440 435 
             Q 480 420 495 385 
             Q 510 350 480 320 
             Q 440 265 300 265 
             Q 160 265 120 320 Z" 
          fill="#D6E5F5" stroke="#BFD5EC" stroke-width="2.5" />
    
    <!-- Plate Inner Checkered Texture -->
    <path d="M 120 320 
             Q 90 350 105 385 
             Q 120 420 160 435 
             Q 220 465 300 465 
             Q 380 465 440 435 
             Q 480 420 495 385 
             Q 510 350 480 320 
             Q 440 265 300 265 
             Q 160 265 120 320 Z" 
          fill="url(#plate-check)" />

    <!-- Stars on the plate rim -->
    <g fill="#93B1D8">
      <polygon points="230,435 233,442 240,443 235,448 236,455 230,451 224,455 225,448 220,443 227,442" />
      <polygon points="360,430 363,437 370,438 365,443 366,450 360,446 354,450 355,443 350,438 357,437" />
      <polygon points="465,305 468,312 475,313 470,318 471,325 465,321 459,325 460,318 455,313 462,312" />
      <polygon points="135,300 138,307 145,308 140,313 141,320 135,316 129,320 130,313 125,308 132,307" />
    </g>
  </g>

  <!-- Bear Chef behind Cake -->
  <g id="bear-chef">
    <!-- Lavender Spoon behind Bear -->
    <g transform="translate(280, 20) rotate(22)">
      <ellipse cx="60" cy="65" rx="25" ry="36" fill="#C9BCE2" stroke="#B2A1D2" stroke-width="1.5" />
      <rect x="54" y="98" width="12" height="60" rx="6" fill="#C9BCE2" stroke="#B2A1D2" stroke-width="1.5" />
      <!-- White Paw Print on spoon -->
      <ellipse cx="60" cy="72" rx="10" ry="8" fill="#FFFFFF" />
      <circle cx="51" cy="58" r="3.5" fill="#FFFFFF" />
      <circle cx="60" cy="53" r="3.5" fill="#FFFFFF" />
      <circle cx="69" cy="58" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Bear Ears -->
    <circle cx="185" cy="72" r="28" fill="#8D624E" />
    <circle cx="185" cy="72" r="16" fill="#6B4533" />
    <circle cx="270" cy="72" r="28" fill="#8D624E" />
    <circle cx="270" cy="72" r="16" fill="#6B4533" />

    <!-- Bear Head -->
    <ellipse cx="230" cy="95" rx="62" ry="50" fill="#8D624E" />

    <!-- Chef Hat -->
    <g>
      <path d="M 195 62 Q 185 25 210 25 Q 230 18 245 28 Q 265 22 265 60 Z" fill="#FFFBEB" stroke="#EADEB8" stroke-width="2" />
      <rect x="200" y="58" width="55" height="12" rx="5" fill="#FFFBEB" stroke="#EADEB8" stroke-width="1.5" />
    </g>

    <!-- Bear Face Details -->
    <ellipse cx="230" cy="112" rx="20" ry="15" fill="#B38973" />
    <ellipse cx="230" cy="108" rx="5" ry="4" fill="#2E1C14" />
    <circle cx="212" cy="105" r="3.5" fill="#2E1C14" />
    <circle cx="248" cy="105" r="3.5" fill="#2E1C14" />
    <!-- Yellow Ribbon Bow at neck -->
    <path d="M 224 135 Q 220 125 230 132 Q 240 125 236 135" stroke="#F5D76E" stroke-width="3" fill="none" />
    <path d="M 230 134 L 225 152 M 230 134 L 235 152" stroke="#F5D76E" stroke-width="2.5" />
  </g>

  <!-- Blueberries Row on Top of Cake -->
  <g id="blueberries">
    <circle cx="175" cy="148" r="28" fill="#4D5D99" stroke="#3A487E" stroke-width="2" />
    <circle cx="230" cy="142" r="28" fill="#43528A" stroke="#333E6E" stroke-width="2" />
    <circle cx="285" cy="140" r="28" fill="#4D5D99" stroke="#3A487E" stroke-width="2" />
    <circle cx="340" cy="142" r="28" fill="#43528A" stroke="#333E6E" stroke-width="2" />
    <circle cx="395" cy="148" r="28" fill="#4D5D99" stroke="#3A487E" stroke-width="2" />
    <circle cx="440" cy="155" r="26" fill="#3D4A7D" stroke="#2D375E" stroke-width="2" />
  </g>

  <!-- Fluffy White Cream Layer under Blueberries -->
  <g id="cream-row">
    <path d="M 150 175 
             Q 175 160 200 175 
             Q 225 160 250 175 
             Q 275 160 300 175 
             Q 325 160 350 175 
             Q 375 160 400 175 
             Q 425 160 450 175 
             L 450 190 L 150 190 Z" fill="#FFFFFF" />
  </g>

  <!-- Main Layer Cake Body -->
  <g id="cake-layers">
    <!-- Top Lavender Sponge -->
    <rect x="150" y="185" width="300" height="30" fill="#C2B2DA" />

    <!-- Cream Drip Layer 1 (White with Polka Dots) -->
    <path d="M 150 215 
             L 450 215 
             L 450 255 
             Q 430 255 420 270 
             Q 410 285 395 260 
             Q 380 255 365 275 
             Q 350 290 330 255 
             Q 310 255 300 280 
             Q 285 300 270 255 
             Q 250 255 240 270 
             Q 230 280 210 255 
             Q 190 255 180 275 
             Q 165 290 150 255 Z" fill="#FFFDF8" />

    <!-- Middle Lavender Sponge -->
    <rect x="150" y="275" width="300" height="42" fill="#BAA4D4" />

    <!-- Lower Cream Layer with Drips -->
    <path d="M 150 315 
             L 450 315 
             L 450 365 
             Q 420 370 410 395 
             Q 395 410 375 375 
             Q 350 375 340 395 
             Q 325 410 300 370 
             Q 275 370 260 390 
             Q 245 405 220 365 
             Q 190 365 175 385 
             Q 160 395 150 365 Z" fill="#FFFDF8" />

    <!-- Chocolate Sponge Base Layer -->
    <rect x="155" y="375" width="290" height="22" rx="4" fill="#63402A" />

    <!-- Bottom White Cream Rounded Board -->
    <path d="M 145 345 Q 145 395 160 398 L 440 398 Q 455 395 455 345 Z" fill="#FFFDF8" opacity="0.45" />

    <!-- Decorative Star Sprinkles on the Cake -->
    <g>
      <!-- Pink Stars -->
      <polygon points="210,230 212,235 218,236 214,240 215,246 210,243 205,246 206,240 202,236 208,235" fill="#F8A2B9" />
      <polygon points="370,235 372,240 378,241 374,245 375,251 370,248 365,251 366,245 362,241 368,240" fill="#F8A2B9" />
      <polygon points="160,335 162,340 168,341 164,345 165,351 160,348 155,351 156,345 152,341 158,340" fill="#F8A2B9" />
      <polygon points="375,330 377,335 383,336 379,340 380,346 375,343 370,346 371,340 367,336 373,335" fill="#F8A2B9" />
      
      <!-- Yellow Stars -->
      <polygon points="315,240 317,245 323,246 319,250 320,256 315,253 310,256 311,250 307,246 313,245" fill="#FAD46E" />
      <polygon points="225,332 227,337 233,338 229,342 230,348 225,345 220,348 221,342 217,338 223,337" fill="#FAD46E" />
      <polygon points="420,295 422,300 428,301 424,305 425,311 420,308 415,311 416,305 412,301 418,300" fill="#FAD46E" />

      <!-- Blue Stars -->
      <polygon points="180,295 182,300 188,301 184,305 185,311 180,308 175,311 176,305 172,301 178,300" fill="#A4C7EC" />
      <polygon points="320,325 322,330 328,331 324,335 325,341 320,338 315,341 316,335 312,331 318,330" fill="#A4C7EC" />

      <!-- Brown Stars -->
      <polygon points="265,270 267,275 273,276 269,280 270,286 265,283 260,286 261,280 257,276 263,275" fill="#6A4E3B" />
      <polygon points="360,290 362,295 368,296 364,300 365,306 360,303 355,306 356,300 352,296 358,295" fill="#6A4E3B" />
      <polygon points="260,350 262,355 268,356 264,360 265,366 260,363 255,366 256,360 252,356 258,355" fill="#6A4E3B" />
    </g>

    <!-- Brown Polka-Dot Ribbon Bow on the Right Side -->
    <g id="ribbon-bow" transform="translate(425, 220)">
      <!-- Left loop -->
      <path d="M 0 0 Q -25 -25 -10 -40 Q 5 -25 0 0" fill="#6B4A37" stroke="#523624" stroke-width="2" />
      <!-- Right loop -->
      <path d="M 0 0 Q 30 -20 35 -5 Q 20 15 0 0" fill="#6B4A37" stroke="#523624" stroke-width="2" />
      <!-- Knot -->
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#523624" />
      <!-- Ribbon Tails -->
      <path d="M -3 4 Q -15 35 -10 70 Q -4 75 0 65 Q -8 35 3 4 Z" fill="#6B4A37" stroke="#523624" stroke-width="1.5" />
      <path d="M 4 4 Q 15 35 25 75 Q 32 75 28 65 Q 18 35 7 4 Z" fill="#6B4A37" stroke="#523624" stroke-width="1.5" />
      <!-- White dots on ribbon -->
      <circle cx="-10" cy="-25" r="2" fill="#FFFFFF" />
      <circle cx="20" cy="-5" r="2" fill="#FFFFFF" />
      <circle cx="-6" cy="30" r="1.8" fill="#FFFFFF" />
      <circle cx="-8" cy="50" r="1.8" fill="#FFFFFF" />
      <circle cx="16" cy="35" r="1.8" fill="#FFFFFF" />
      <circle cx="22" cy="55" r="1.8" fill="#FFFFFF" />
    </g>
  </g>
</svg>
